services:
  - type: web
    name: corland-partners-website
    runtime: docker
    repo: https://github.com/Corland-Partners-LLC/corlandwebsite
    branch: main
    region: ohio
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    domains:
      - corlandpartners.com
    envVars:
      - key: PORT
        value: "10000"
      - key: NEXT_PUBLIC_SITE_URL
        value: https://www.corlandpartners.com
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_EMAIL_FROM
        sync: false
      - key: CONTACT_FORM_TO_EMAIL
        sync: false
