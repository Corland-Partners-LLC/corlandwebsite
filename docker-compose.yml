services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://www.corlandpartners.com}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
    restart: unless-stopped
